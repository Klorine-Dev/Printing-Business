    <script defer>try{
        const url=new URLSearchParams(window.location.search);
        const card=document.getElementById("card");
        function downloadURI(uri, name) {
            var link=document.createElement("a");
            link.download=name;
            link.href=uri;
            link.click();
            //after creating link you should delete dynamic link
            // clearDynamicLink(link); 
        }
        // alert();
        url.forEach((value,key)=>{
            // alert(`${key}: ${value}`);
            switch(key){
                case"n":document.getElementById("cardname").innerText=value;break;
                case"i":
                    document.getElementById("barcode").innerText=value;
                    document.getElementById("cardid").innerText=value;
                break;
                case "fc":
                    if(localStorage.getItem("idgenData")==null) alert("error: no cookie is present");
                    else {
                        let igd=JSON.parse(localStorage.getItem("idgenData"));
                        document.getElementById("cardname").innerText=igd.name;
                        document.getElementById("cardgradyear").innerText=`Class of ${igd.gradyear}`;
                        document.getElementById("barcode").innerText=igd.idnum;
                        document.getElementById("cardid").innerText=igd.idnum;
                        document.getElementById("pfp").style.backgroundImage=`url("${igd.imgsrc}")`;
                    }
                break;
                case "qx":
                    html2canvas(card,{
                        allowTaint: true,
                        useCORS:true,
                        backgroundColor:null,
                    }).then((canvas)=>{
                        var myImage=canvas.toDataURL("image/png");
                        downloadURI("data:"+myImage,"idphoto.png");
                        // document.getElementById("closeWin").style.display="flex !important";
                        // open(location, '_self').close();
                    });    
                break;
                case"g":document.getElementById("cardgradyear").innerText=`Class of ${value}`;break;
                default:alert(`unknown key: ${key} (value: ${value})`);
            }
        });
    }catch(e){alert(e)}</script>
